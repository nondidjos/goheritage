title: Plan / Relevé
accept:
  extension: [jpg, jpeg, png, webp, tif, tiff, pdf, svg, dwg, dxf]

# Files tagged with this template trigger automatic tile generation
# (see site/plugins/plan-viewer). Raster images get a DeepZoom pyramid
# for the anti-download viewer; PDF / DWG / DXF currently fall back to
# the original file with a "download only" notice.

fields:
  caption:
    type: text
    label: Légende
    placeholder: "ex. Plan du rez-de-chaussée, échelle 1:100"

  scale:
    width: 1/2
    type: text
    label: Échelle
    placeholder: "ex. 1:50"

  level:
    width: 1/2
    type: text
    label: Niveau / Étage
    placeholder: "ex. RDC, R+1, sous-sol"

  source:
    type: text
    label: Source / Crédit
    placeholder: "ex. Bureau Horta &amp; Partners — 2024"

  notes:
    type: textarea
    label: Notes internes
    help: Ces notes ne sont pas affichées publiquement.
    size: small
