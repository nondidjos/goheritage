title: Article
num: date
icon: document

status:
  draft:
    label: Brouillon
    text: L'article est en cours de rédaction. Visible uniquement par les éditeurs.
  unlisted:
    label: En relecture
    text: L'article est en ligne mais accessible uniquement via son URL directe.
  listed:
    label: Publié
    text: L'article est en ligne et visible dans le blog.

columns:
  - width: 2/3
    fields:
      text:
        type: blocks
        label: Contenu

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          cover: fields/cover
          date:
            type: date
            label: Date de publication
            time: true
            default: now
          featured:
            type: toggle
            label: Article mis en avant
            text:
              - Non
              - Oui
            default: false
          author:
            type: tags
            label: Auteur
            max: 1
            options: query
            query: kirby.users
            text: "{{ user.name }}"
            value: "{{ user.name }}"
            help: "Sélectionnez un utilisateur du CMS ou tapez un nouveau nom."
          tags:
            type: tags
            label: Tags
            options: query
            query: site.index.pluck("tags", ",", true)
            help: "Sélectionnez un tag existant ou tapez-en un nouveau."

          primary_tag:
            type: select
            label: Tag mis en avant
            placeholder: "Premier tag par défaut"
            options: query
            query: site.index.pluck("tags", ",", true)
            help: "Tag affiché en badge sur les cartes. Si vide, le premier tag est utilisé."
      files:
        type: files
        label: Fichiers
        layout: cards
        size: medium
        template: blocks/image
