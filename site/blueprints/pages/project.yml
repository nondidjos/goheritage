title: Heritage Project
icon: 🏛️

num: 0

status:
  draft:
    label: Draft
    text: Not visible on the map yet.
  listed:
    label: Published
    text: Visible on the map.

tabs:
  content:
    label: Contenu & Méta
    icon: text
    columns:
      - width: 2/3
        fields:
          description:
            type: textarea
            label: Courte description
            help: Un résumé affiché sous le titre et sur les cartes.
            size: small

          text:
            type: blocks
            label: Contenu détaillé

          gallery:
            type: files
            label: Galerie d'images (droite)
            layout: cards
            size: small
            help: Images affichées dans la grille de droite de la page.
            uploads: image
            query: page.images.template('image')

          additional_images:
            type: files
            label: Images supplémentaires
            layout: cards
            size: small
            help: Images complémentaires affichées sous la fiche technique (lightbox individuelle).
            uploads: image
            query: page.images.template('image')

      - width: 1/3
        sections:
          meta:
            type: fields
            fields:
              cover: fields/cover
              
              location:
                type: text
                label: Lieu
                placeholder: "ex. Bruxelles, Belgique"
              
              construction_date:
                type: text
                label: Date de construction
                placeholder: "ex. 15ème siècle, 1889"
              
              architect:
                type: text
                label: Architecte / Créateur
                placeholder: "ex. Victor Horta"
              
              style:
                type: text
                label: Style architectural
                placeholder: "ex. Article Nouveau, Gothique"
              
              dimensions:
                type: text
                label: Dimensions (L x l x H)
                placeholder: "ex. 40x20x15m"

              protection_status:
                type: select
                label: Statut de protection
                options:
                  - Classé Monument Historique
                  - Inscrit au patrimoine mondial de l'UNESCO
                  - Inventaire Régional
                  - Non protégé
              
              condition:
                type: select
                label: État de conservation
                options:
                  - Excellent
                  - Bon
                  - En péril
                  - Ruine
                  - Disparu
              
              lat:
                type: number
                label: Latitude
                step: 0.000001
              
              lng:
                type: number
                label: Longitude
                step: 0.000001
              
              date:
                type: date
                label: Date du Scan/Mise en ligne
                default: now
              
              tags:
                type: tags
                label: Tags (ex. architecture, abbaye)

  viewer:
    label: Modèle 3D
    label: Modèle 3D
    icon: box
    columns:
      - width: 1/1
        fields:
          model_obj:
            type: files
            label: Fichier OBJ (.obj)
            multiple: false
            accept:
              extension: obj
            help: "Le modèle photogrammétrique. Uploadez le fichier .obj ici."

          model_texture:
            type: files
            label: Texture diffuse (.jpg ou .png)
            multiple: false
            accept:
              extension: jpg, jpeg, png
            help: "La texture à appliquer sur le modèle (ex. _diffuse.png). Doit être dans le même dossier que le .obj."

          model_mtl:
            type: files
            label: Fichier matériaux (.mtl) — optionnel
            multiple: false
            accept:
              extension: mtl
            help: "Si votre export OBJ inclut un .mtl, uploadez-le ici."

          viewer_url:
            type: url
            label: Ou, URL d'un viewer externe (Potree, Sketchfab…)
            placeholder: "https://votre-serveur.com/potree/viewer.html"
            help: "Alternative si le modèle est hébergé ailleurs. Ce lien sera chargé dans une iframe."

          compress_textures:
            type: toggle
            label: Activer la compression des textures
            text:
              - Non
              - Oui (Convertir en JPEG optimisé)
            default: true
            help: "Si activé, les textures lourdes (PNG, JPG) uploadées seront converties en JPEG optimisés pour le web."

  annotations:
    label: Points d'intérêt
    icon: pin
    columns:
      - width: 1/1
        fields:
          annotations_info:
            type: info
            text: >
              Ajoutez des points d'intérêt qui apparaissent sur le modèle 3D.
              Les hotspots sont **détectés automatiquement** lors de l'upload d'un GLB.
              Cliquez sur le bouton ci-dessous pour relancer la détection manuellement.
              L'**identifiant** doit correspondre au nom de l'Empty placé dans Blender
              (ex. `hotspot_01`). Exportez le GLB avec « Custom Properties » activé.

          hotspot_detect:
            type: hotspot-detect
            label: Détection automatique

          annotations:
            type: structure
            label: Annotations
            columns:
              hotspot_id:
                width: 1/5
                label: ID
              title:
                width: 1/4
                label: Titre
              description:
                width: 1/2
                label: Description
            fields:
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                required: true
                help: "Doit correspondre au nom de l'Empty dans Blender."
              title:
                type: text
                label: Titre
                required: true
                placeholder: "ex. Voûte principale"
              description:
                type: writer
                label: Description
                help: "Texte affiché dans le panneau de gauche quand ce point est sélectionné."
