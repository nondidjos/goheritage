title: Projet Patrimonial
icon: box

num: 0

status:
  draft:
    label: Brouillon
    text: Page non finalisée — invisible publiquement.
  listed:
    label: Enregistré
    text: La visibilité publique dépend du réglage « Qui peut voir cette page ? ».

# Header buttons. The "visibility" button (our custom dropdown) is the
# SINGLE control for publish state — it merges Kirby's native status
# (draft/listed) with our 3-tier visibility model (privé/lien/public).
# Picking "Brouillon" sets status=draft + visibility=private; "Avec un
# lien" sets status=listed + visibility=link; "Public" sets status=listed
# + visibility=public. The native `status` button is intentionally NOT
# listed here — it would duplicate the same control.
buttons:
  - open
  - preview
  - settings
  - visibility

tabs:

  # ─────────────────────────────────────────────────────────────────────
  #  Tab 1 — Aperçu
  #
  #  Visibility, general info, description, content blocks, tags.
  #  Sections render as separate cards so the page reads top-to-bottom
  #  as a clean read-only doc until the user clicks "Modifier".
  # ─────────────────────────────────────────────────────────────────────
  overview:
    label: Aperçu
    icon: text
    sections:

      # ── Visibility is controlled from the page header ─────────────
      # The dropdown next to the status button lets you switch between
      # Privé / Avec un lien / Public and exposes the share URL inline.
      # The fields below back that dropdown — kept as hidden inputs so
      # the values still serialise to content.txt.
      visibility_meta:
        type: fields
        fields:
          visibility:
            type: hidden
          share_token:
            type: hidden

      # ── Sharing: what is exposed when the page is shared ──────────
      # Only relevant when visibility ≠ private. Hidden otherwise so
      # the form stays focused on the project's actual content.
      sharing_section:
        type: fields
        headline: Partage
        when:
          visibility:
            - public
            - link
        fields:
          sharing_info:
            label: false
            type: info
            theme: info
            text: >
              **Partage actif** — utilisez le menu **Visibilité** dans l'en-tête
              pour basculer ou copier le lien. Choisissez ci-dessous les sections
              qui apparaîtront aux visiteurs.

          visible_sections:
            type: checkboxes
            label: Sections visibles publiquement
            columns: 2
            options:
              model:       Modèle 3D
              info:        Fiche technique
              gallery:     Galerie d'images
              plans:       Plans & documents
              annotations: Points d'intérêt
            default:
              - model
              - info
              - gallery
              - annotations

      # ── General info / fiche technique ───────────────────────────
      info_section:
        type: fields
        headline: Présentation
        fields:
          cover: fields/cover

          description:
            type: textarea
            label: Description courte
            help: Résumé affiché sous le titre et sur les cartes du site.
            size: small

      spec_section:
        type: fields
        headline: Fiche technique
        fields:
          location:
            width: 1/2
            type: text
            label: Lieu
            placeholder: "ex. Bruxelles, Belgique"
            icon: pin

          date:
            width: 1/2
            type: date
            label: Date du scan
            default: now

          construction_date:
            width: 1/2
            type: text
            label: Date de construction
            placeholder: "ex. XVe siècle, 1889"

          architect:
            width: 1/2
            type: text
            label: Architecte / Créateur
            placeholder: "ex. Victor Horta"

          style:
            width: 1/2
            type: text
            label: Style architectural
            placeholder: "ex. Art Nouveau, Gothique"

          dimensions:
            width: 1/2
            type: text
            label: Dimensions (L × l × H)
            placeholder: "ex. 40 × 20 × 15 m"

          protection_status:
            width: 1/2
            type: select
            label: Statut de protection
            icon: protected
            options:
              classé:   Classé Monument Historique
              unesco:   Inscrit au patrimoine mondial de l'UNESCO
              regional: Inventaire Régional
              none:     Non protégé

      # ── Geolocation ───────────────────────────────────────────────
      geo_section:
        type: fields
        headline: Géolocalisation
        fields:
          location_search:
            type: location-search
            label: Recherche de coordonnées
            help: Tapez un nom de lieu pour remplir automatiquement la latitude et la longitude.

          lat:
            width: 1/2
            type: number
            label: Latitude
            step: 0.000001
            placeholder: "ex. 50.8503"

          lng:
            width: 1/2
            type: number
            label: Longitude
            step: 0.000001
            placeholder: "ex. 4.3517"

      # ── Content blocks ────────────────────────────────────────────
      content_section:
        type: fields
        headline: Contenu détaillé
        fields:
          text:
            type: blocks
            label: false
            fieldsets:
              - heading
              - text
              - image
              - gallery
              - video
              - quote
              - section

      # ── Gallery ───────────────────────────────────────────────────
      gallery_section:
        type: fields
        headline: Galerie d'images
        fields:
          gallery:
            type: files
            label: false
            layout: cards
            size: medium
            help: Images affichées dans la grille de droite de la page projet.
            uploads: image
            query: page.images.template('image')

      # ── Tags ──────────────────────────────────────────────────────
      tags_section:
        type: fields
        headline: Tags
        fields:
          tags:
            width: 1/2
            type: tags
            label: Tags
            options: query
            query: site.index.pluck("tags", ",", true)
            help: Réutilisez un tag existant ou créez-en un nouveau.

          primary_tag:
            width: 1/2
            type: select
            label: Tag mis en avant
            placeholder: "Premier tag par défaut"
            options: query
            query: site.index.sortedUniqueTags()
            help: Affiché en badge sur les cartes.


  # ─────────────────────────────────────────────────────────────────────
  #  Tab 2 — Modèle 3D
  #
  #  Three.js viewer config + textured OBJ/GLB pairs for exterior and
  #  interior + hotspot JSON + point-of-interest annotations.
  # ─────────────────────────────────────────────────────────────────────
  model:
    label: Modèle 3D
    icon: box
    sections:

      # ── Réglages du viewer ───────────────────────────────────────
      # Combined: viewer URL + default-side toggle + pipeline reminder.
      # The pipeline note used to live in its own section (pipeline_info)
      # but that was just a banner — folded in here as an info field at
      # the bottom of the settings card so it stays close to the upload
      # workflow without claiming a section of its own.
      viewer_settings:
        type: fields
        headline: Réglages du viewer
        fields:
          viewer_url:
            width: 1/2
            type: url
            label: Viewer externe
            placeholder: "https://…"
            help: Potree, Sketchfab, etc. Remplace le viewer Three.js si renseigné.

          model_toggle:
            width: 1/2
            type: toggle
            label: Modèle affiché par défaut
            text:
              - Extérieur
              - Intérieur
            default: false

          pipeline_note:
            label: false
            type: info
            theme: info
            text: |
              **Pipeline OBJ** — Exportez le modèle en OBJ + texture depuis Blender,
              puis les hotspots en JSON via l'addon GoHéritage. Les textures sont
              compressées automatiquement à l'upload.

      # ── Modèle extérieur ─────────────────────────────────────────
      # All exterior 3D assets in one section: model, texture, hotspots.
      # Accordion trigger removed — sections are already collapsible at
      # the panel level via the edit/lock pattern.
      exterior_files:
        type: fields
        headline: Modèle extérieur
        fields:
          model_obj:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            help: Fichier OBJ exporté depuis Blender.

          model_texture:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. Déposez un PNG puis comprimez en WebP.

          model_hotspots_json:
            type: upload-overwrite
            label: Hotspots (JSON)
            accept: ".json"
            template: default
            help: JSON exporté par l'addon Blender pour le modèle extérieur.

      # ── Modèle intérieur ─────────────────────────────────────────
      interior_files:
        type: fields
        headline: Modèle intérieur
        fields:
          model_obj_interior:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            template: model
            help: Fichier OBJ exporté depuis Blender.

          model_texture_interior:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. Déposez un PNG puis comprimez en WebP.

          model_hotspots_json_interior:
            type: upload-overwrite
            label: Hotspots (JSON)
            accept: ".json"
            template: default
            help: JSON exporté par l'addon Blender pour le modèle intérieur.

      # ── Points d'intérêt (titres + descriptions des hotspots) ────
      annotations_section:
        type: fields
        headline: Points d'intérêt
        fields:

          # Single annotations structure for both exterior and interior
          # hotspots. Each row carries a `location` column so the viewer
          # knows which model to attach the marker to. Two previously
          # separate fields (`annotations` + `annotations_interior`) were
          # merged in May 2026 — existing pages were migrated by
          # `scripts/migrate-annotations.php`.
          annotations:
            type: structure
            label: Points d'intérêt
            sortBy: location asc
            columns:
              location:
                width: 1/12
                label: Modèle
              hotspot_id:
                width: 2/12
                label: ID
              title:
                width: 3/12
                label: Titre
              camera_mode:
                width: 2/12
                label: Mode
              description:
                width: 4/12
                label: Description
            fields:
              location:
                type: select
                label: Modèle
                default: exterior
                required: true
                options:
                  exterior: Extérieur
                  interior: Intérieur
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                help: Doit correspondre au nom de l'Empty dans Blender.
              title:
                type: text
                label: Titre
                placeholder: "ex. Voûte principale"
              camera_mode:
                type: select
                label: Comportement au clic
                default: fly
                options:
                  fly:        Voler vers le point
                  orbit:      Orbiter autour du point
                  auto-orbit: Orbite automatique (360°)
              description:
                type: writer
                label: Description


  # ─────────────────────────────────────────────────────────────────────
  #  Tab 3 — Documents
  #
  #  Single tab, three clearly-separated cards:
  #    1) Plans & relevés  — visual thumbnails (cards layout, with the
  #       plan viewer reachable from each tile)
  #    2) Autres documents — list layout so date, size and type are
  #       columnar and scannable
  #    3) Tous les fichiers — flat list of every file attached to the
  #       page, including model files uploaded from the 3D tab
  # ─────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────
  #  Tab 3 — Fichiers (raw file inventory — comes BEFORE Documents on
  #  purpose; this is the "see everything" view, Documents is the
  #  curated upload UI).
  # ─────────────────────────────────────────────────────────────────────
  files:
    label: Fichiers
    icon: archive
    sections:

      all_files:
        type: fields
        headline: Inventaire des fichiers
        fields:
          page_files:
            type: page-files-list
            label: false
            help: |
              Liste plate de **tous les fichiers attachés à cette page** — modèles 3D,
              textures, plans, images de galerie, JSON, etc. Pour téléverser des
              fichiers, utilisez les onglets dédiés (Documents, Modèle 3D, etc.).


  # ─────────────────────────────────────────────────────────────────────
  #  Tab 4 — Documents (curated upload UI: Plans + Autres documents)
  # ─────────────────────────────────────────────────────────────────────
  documents:
    label: Documents
    icon: file-document
    sections:

      # ── 1. Plans & relevés ───────────────────────────────────────
      plans:
        type: files
        headline: Plans & relevés
        info: "{{ file.niceSize }} · {{ file.modified('d.m.Y') }} · {{ file.extension }}"
        layout: cards
        size: small
        empty: Aucun plan pour l'instant. Glissez-déposez des PDF, JPG, PNG, SVG ou DWG ici.
        template: default
        accept: ".pdf,.jpg,.jpeg,.png,.webp,.dwg,.dxf,.svg"
        image:
          back: pattern
          cover: true

      # ── 2. Autres documents ──────────────────────────────────────
      docs:
        type: files
        headline: Autres documents
        # In list layout the info string becomes the row's secondary line,
        # right next to the filename, so dates and sizes are always visible.
        info: "{{ file.extension | upper }} · {{ file.niceSize }} · modifié {{ file.modified('d.m.Y') }}"
        layout: list
        empty: Rien pour l'instant. Glissez-déposez ici vos PDF, .docx, .zip, etc.
        template: default
        accept: ".pdf,.doc,.docx,.odt,.txt,.md,.zip"
