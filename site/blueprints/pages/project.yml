title: Projet Patrimonial
icon: box

num: 0

status:
  draft:
    label: Brouillon
    text: Pas encore visible sur la carte.
  listed:
    label: Publié
    text: Visible sur la carte et le site.

tabs:
  # ── Tab 1 : Contenu ────────────────────────────────────────────────────────
  content:
    label: Contenu
    icon: text
    fields:
      description:
        type: textarea
        label: Description courte
        help: Résumé affiché sous le titre et sur les cartes du site.
        size: small

      text:
        type: blocks
        label: Contenu détaillé
        fieldsets:
          - heading
          - text
          - image
          - gallery
          - video
          - quote
          - section

      gallery:
        type: files
        label: Galerie
        layout: cards
        size: medium
        help: Images affichées dans la grille de droite de la page projet.
        uploads: image
        query: page.images.template('image')

  # ── Tab 2 : Fiche technique ────────────────────────────────────────────────
  info:
    label: Fiche technique
    icon: table
    columns:
      - width: 1/2
        fields:
          cover: fields/cover

          location:
            type: text
            label: Lieu
            placeholder: "ex. Bruxelles, Belgique"

          construction_date:
            type: text
            label: Date de construction
            placeholder: "ex. XVe siècle, 1889"

          architect:
            type: text
            label: Architecte / Créateur
            placeholder: "ex. Victor Horta"

          style:
            type: text
            label: Style architectural
            placeholder: "ex. Art Nouveau, Gothique"

          dimensions:
            type: text
            label: Dimensions (L × l × H)
            placeholder: "ex. 40 × 20 × 15 m"

      - width: 1/2
        fields:
          protection_status:
            type: select
            label: Statut de protection
            options:
              classé: Classé Monument Historique
              unesco: Inscrit au patrimoine mondial de l'UNESCO
              regional: Inventaire Régional
              none: Non protégé

          location_search:
            type: location-search
            label: Recherche de coordonnées
            help: Tapez un nom de lieu pour remplir automatiquement la latitude et la longitude.

          lat:
            type: number
            label: Latitude
            step: 0.000001
            placeholder: "ex. 50.8503"

          lng:
            type: number
            label: Longitude
            step: 0.000001
            placeholder: "ex. 4.3517"

          date:
            type: date
            label: Date du scan
            default: now

          tags:
            type: tags
            label: Tags
            options: query
            query: site.index.pluck("tags", ",", true)
            help: "La région est dérivée automatiquement du champ Lieu — pas besoin de l'ajouter ici."

          primary_tag:
            type: select
            label: Tag mis en avant
            placeholder: "Premier tag par défaut"
            options: query
            query: site.index.pluck("tags", ",", true)
            help: "Tag affiché en badge sur les cartes. Si vide, le premier tag est utilisé."

  # ── Tab : Commercial ──────────────────────────────────────────────────────
  commercial:
    label: Commercial
    icon: cart
    columns:
      - width: 1/2
        fields:
          commercial_info:
            label: false
            type: info
            theme: info
            text: >
              **Section commerciale** — séparée de l'historique. Activez les
              activités proposées par cette propriété : un badge clickable
              s'affichera côté visiteur.

          avail_activities:
            label: Activités proposées
            type: checkboxes
            columns: 2
            options:
              visite: Visites guidées
              mariage: Mariages
              seminaire: Séminaires / réceptions
              tournage: Tournages / shootings
              hebergement: Hébergement
              evenement: Événements culturels

          commercial_pitch:
            label: Argumentaire commercial
            type: textarea
            size: small
            help: Présentation courte des prestations (≤ 300 caractères). Affichée sous les badges.

          commercial_priceFrom:
            label: À partir de (€)
            type: number
            placeholder: "ex. 1500"
            help: Prix de départ indicatif. Affiché sur les badges si renseigné.

      - width: 1/2
        fields:
          owner_info:
            label: false
            type: info
            theme: info
            text: >
              **Contact du propriétaire** — visible côté visiteur sur la
              page projet. Laissez vide pour rediriger les demandes vers le
              formulaire de contact général.

          owner_name:
            label: Nom du propriétaire / contact
            type: text
            placeholder: "ex. Famille de Theux"

          owner_email:
            label: E-mail
            type: email
            placeholder: "contact@chateau-x.be"

          owner_phone:
            label: Téléphone
            type: tel
            placeholder: "+32 …"

          owner_website:
            label: Site web
            type: url
            placeholder: "https://…"

  # ── Tab 3 : Modèle 3D ─────────────────────────────────────────────────────
  viewer:
    label: Modèle 3D
    icon: box
    columns:
      - width: 1/2
        fields:
          viewer_url:
            type: url
            label: Viewer externe
            placeholder: "https://…"
            help: Potree, Sketchfab, etc. Remplace le viewer Three.js si renseigné.

      - width: 1/2
        fields:
          model_toggle:
            type: toggle
            label: Quel modèle afficher par défaut ?
            text:
              - Extérieur
              - Intérieur
            default: false

      # ── Alignement manuel des marqueurs panorama ──────────────────────────
      - width: 1/1
        fields:
          marker_align_info:
            label: false
            type: info
            theme: info
            text: >
              **Alignement marqueurs panorama** — laissez vide pour centrer
              automatiquement sur le modèle. Renseignez (mètres, Three.js
              Y-up : X = droite, Y = haut, Z = vers la caméra) si l'auto
              tombe à côté.

      - width: 1/3
        fields:
          marker_offset_x:
            type: number
            label: Décalage X
            step: 0.1
            placeholder: auto
      - width: 1/3
        fields:
          marker_offset_y:
            type: number
            label: Décalage Y
            step: 0.1
            placeholder: auto
      - width: 1/3
        fields:
          marker_offset_z:
            type: number
            label: Décalage Z
            step: 0.1
            placeholder: auto

      - width: 1/2
        fields:
          viewer_preference:
            type: select
            label: Type de viewer
            default: auto
            options:
              auto: Auto (panorama si dispo, sinon 3D)
              model: Modèle 3D (Three.js)
              panorama: Panorama (PanoViewer)
            help: "Détermine quel viewer utiliser sur la page projet. Ignoré si Viewer externe est renseigné."

      # ── Panorama (PanoViewer) ────────────────────────────────────────────────
      - width: 1/1
        fields:
          pano_accordion:
            type: accordion-trigger
            label: Panorama (PanoViewer)
            target: panorama
            defaultOpen: false

          pano_info:
            label: false
            type: info
            theme: info
            text: >
              **Pipeline Panorama** — Dump Matterport (6 faces par scène,
              `{id}_skybox0…5.jpg`) ou équirectangulaires. Utilisez l'import
              ci-dessous pour lier les positions, ou déposez un JSON manuellement.

          matterport_import:
            type: matterport-import
            label: Extraction Matterport

          pano_upload:
            type: pano-upload

          pano_hotspots_json:
            type: upload-overwrite
            label: JSON Hotspots (manuel)
            accept: ".json"
            template: default
            help: "Remplace l'import auto. JSON GoHéritage définissant scènes et positions."


      # ── Fichiers : Extérieur & Intérieur ─────────────────────────────────────
      - width: 1/1
        fields:
          obj_info:
            label: false
            type: info
            theme: info
            text: >
              **Pipeline OBJ** — Exportez le modèle en OBJ + texture depuis Blender,
              puis les hotspots en JSON via l'addon GoHéritage.

          exterior_accordion:
            type: accordion-trigger
            label: Modèle Extérieur
            target: exterior
            defaultOpen: false

          model_obj:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            template: model
            help: Fichier OBJ exporté depuis Blender.

          model_texture:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. PNG → compresser en JPEG via l'icône image.

          interior_accordion:
            type: accordion-trigger
            label: Modèle Intérieur
            target: interior
            defaultOpen: false

          model_obj_interior:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            template: model
            help: Fichier OBJ exporté depuis Blender.

          model_texture_interior:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. PNG → compresser en JPEG via l'icône image.


  # ── Tab 4 : Fichiers ──────────────────────────────────────────────────────
  files:
    label: Fichiers
    icon: file
    columns:
      - width: 1/1
        fields:
          page_files:
            type: page-files-list

  # ── Tab 5 : Points d'intérêt ──────────────────────────────────────────────
  annotations:
    label: Points d'intérêt
    icon: pin
    columns:
      - width: 1/1
        fields:
          annotations_info:
            label: false
            type: info
            text: >
              Les points d'intérêt apparaissent sous forme de labels cliquables
              sur le modèle 3D. Les positions sont lues depuis le **fichier JSON**
              exporté par l'addon Blender. L'identifiant doit correspondre au nom
              de l'Empty placé dans Blender (ex. `hotspot_01`).

          model_hotspots_json:
            type: upload-overwrite
            label: Hotspots JSON — Extérieur
            accept: ".json"
            template: default
            help: "JSON exporté par l'addon Blender pour le modèle extérieur."

          model_hotspots_json_interior:
            type: upload-overwrite
            label: Hotspots JSON — Intérieur
            accept: ".json"
            template: default
            help: "JSON exporté par l'addon Blender pour le modèle intérieur."


          annotations:
            type: structure
            label: Hotspots — Extérieur
            columns:
              hotspot_id:
                width: 1/6
                label: ID
              title:
                width: 1/4
                label: Titre
              camera_mode:
                width: 1/6
                label: Mode
              description:
                width: 5/12
                label: Description
            fields:
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                help: Doit correspondre au nom de l'Empty dans Blender.
              title:
                type: text
                label: Titre
                placeholder: "ex. Voûte principale"
              camera_mode:
                type: select
                label: Comportement au clic
                default: fly
                options:
                  fly: Voler vers le point
                  orbit: Orbiter autour du point
                  auto-orbit: Orbite automatique (360°)
                help: "Voler : anime la caméra vers la position. Orbiter : idem, puis permet d'orbiter autour. Auto : vol + rotation 360° automatique."
              description:
                type: writer
                label: Description
                help: Texte affiché dans le panneau latéral quand ce point est sélectionné.

          annotations_interior:
            type: structure
            label: Hotspots — Intérieur
            columns:
              hotspot_id:
                width: 1/6
                label: ID
              title:
                width: 1/4
                label: Titre
              camera_mode:
                width: 1/6
                label: Mode
              description:
                width: 5/12
                label: Description
            fields:
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                help: Doit correspondre au nom de l'Empty dans Blender.
              title:
                type: text
                label: Titre
                placeholder: "ex. Tombe"
              camera_mode:
                type: select
                label: Comportement au clic
                default: fly
                options:
                  fly: Voler vers le point
                  orbit: Orbiter autour du point
                  auto-orbit: Orbite automatique (360°)
                help: "Voler : anime la caméra vers la position. Orbiter : idem, puis permet d'orbiter autour. Auto : vol + rotation 360° automatique."
              description:
                type: writer
                label: Description
                help: Texte affiché dans le panneau latéral quand ce point est sélectionné.
