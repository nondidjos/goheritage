title: Projet Patrimonial
icon: box

num: 0

# Trim the page options menu (the Settings button dropdown) to only what
# makes sense for a project: rename, duplicate, delete, change status.
# changeTemplate + move + changePosition are removed — they were either
# grayed-out (position, because num:0 auto-sorts by date) or irrelevant
# (a project never changes template / moves out of the map).
options:
  changeTemplate: false
  move: false

status:
  draft:
    label: Privé
    text: Page non finalisée — invisible publiquement.
  listed:
    label: Enregistré
    text: La visibilité publique dépend du réglage « Qui peut voir cette page ? ».

# Header buttons. The "visibility" button (our custom dropdown) is the
# SINGLE control for publish state — it merges Kirby's native status
# (draft/listed) with our 3-tier visibility model (privé/lien/public).
# Picking "Brouillon" sets status=draft + visibility=private; "Avec un
# lien" sets status=listed + visibility=link; "Public" sets status=listed
# + visibility=public. The native `status` button is intentionally NOT
# listed here — it would duplicate the same control.
buttons:
  - open
  - preview
  - settings
  - visibility

tabs:

  # ─────────────────────────────────────────────────────────────────────
  #  Tab 1 — Aperçu
  #
  #  Two-column layout instead of a single scrolling stack:
  #
  #    LEFT  (1/3) — At-a-glance METADATA: cover, description, key
  #                  characteristics (location, dates, architect, style,
  #                  protection), tags, geolocation, sharing settings.
  #                  Everything someone might want to LOOK UP about the
  #                  project without scrolling through editorial content.
  #
  #    RIGHT (2/3) — EDITORIAL content: the rich text blocks that tell
  #                  the project's story, plus the gallery. This is where
  #                  the actual writing + visual storytelling lives, so
  #                  it gets the wider column to breathe.
  #
  #  Why this matters: previously location was buried inside spec_section
  #  somewhere in the middle of a 7-section scroll, and tags were dead
  #  last. The new layout puts both above-the-fold in the sidebar where
  #  they belong as page metadata.
  # ─────────────────────────────────────────────────────────────────────
  overview:
    label: Aperçu
    icon: text
    sections:
      # Single custom-rendered overview card — cover image, meta chips,
      # tags, asset tiles linking to other tabs. All editing goes
      # through k-form-dialog modals. Implementation: site/plugins/project-ux.
      project_overview:
        type: project-overview

  # ── Détails — single-column, collapsible cards. Edit the project's
  #    description, content blocks, gallery, characteristics, tags, geo
  #    and sharing here. The Aperçu tab links you in for the quick edits;
  #    this is the full surface. ────────────────────────────────────
  details:
    label: Détails
    icon: settings
    sections:

      # Hidden fields backing the visibility header dropdown.
      visibility_meta:
        type: fields
        fields:
          visibility:    { type: hidden }
          share_token:   { type: hidden }
          share_links:   { type: hidden }

      # Présentation — cover + short description (the "card preview").
      cover_section:
        type: fields
        headline: Présentation
        fields:
          cover: fields/cover
          description:
            type: textarea
            label: Description courte
            help: Résumé affiché sous le titre et sur les cartes du site.
            size: small

      # Long-form editorial content.
      content_section:
        type: fields
        headline: Contenu détaillé
        fields:
          text:
            type: blocks
            label: false
            fieldsets:
              - heading
              - text
              - image
              - gallery
              - video
              - quote
              - section

      # Gallery images.
      gallery_section:
        type: fields
        headline: Galerie d'images
        fields:
          gallery:
            type: files
            label: false
            layout: cards
            size: medium
            help: Images affichées dans la grille de droite de la page projet.
            uploads: image
            query: page.images.template('image')

      # Key characteristics.
      meta_section:
        type: fields
        headline: Caractéristiques
        fields:
          location:
            width: 1/2
            type: text
            label: Lieu
            placeholder: "ex. Bruxelles, Belgique"
            icon: pin
          construction_date:
            width: 1/2
            type: text
            label: Date de construction
            placeholder: "ex. XVe siècle, 1889"
          date:
            width: 1/2
            type: date
            label: Date du scan
            default: now
          architect:
            width: 1/2
            type: text
            label: Architecte / Créateur
            placeholder: "ex. Victor Horta"
          style:
            width: 1/2
            type: text
            label: Style architectural
            placeholder: "ex. Art Nouveau"
          dimensions:
            width: 1/2
            type: text
            label: Dimensions
            placeholder: "40 × 20 × 15 m"
          protection_status:
            width: 1/2
            type: select
            label: Statut de protection
            icon: protected
            options:
              classé:   Classé Monument Historique
              unesco:   Patrimoine mondial UNESCO
              regional: Inventaire Régional
              none:     Non protégé

      # Geolocation.
      geo_section:
        type: fields
        headline: Géolocalisation
        fields:
          location_search:
            type: location-search
            label: Recherche
            help: Tapez un nom de lieu pour remplir lat/lng automatiquement.
          lat:
            width: 1/2
            type: number
            label: Latitude
            step: 0.000001
          lng:
            width: 1/2
            type: number
            label: Longitude
            step: 0.000001

      # Tags.
      tags_section:
        type: fields
        headline: Tags
        fields:
          tags:
            width: 1/2
            type: tags
            label: Tags
            options: query
            query: site.index.pluck("tags", ",", true)
            help: Réutilisez un tag existant ou créez-en un nouveau.
          primary_tag:
            width: 1/2
            type: select
            label: Tag mis en avant
            placeholder: "Premier tag par défaut"
            options: query
            query: site.index.sortedUniqueTags()
            help: Affiché en badge sur les cartes du site.

      # Sharing — only renders when visibility ≠ private.
      sharing_section:
        type: fields
        headline: Partage
        when:
          visibility:
            - public
            - link
        fields:
          sharing_info:
            label: false
            type: info
            theme: info
            text: >
              **Partage actif** — utilisez le menu **Visibilité** dans l'en-tête
              pour basculer ou copier le lien. Cochez ci-dessous ce qui apparaît
              aux visiteurs.
          visible_sections:
            type: checkboxes
            label: Sections visibles publiquement
            columns: 2
            options:
              model:       Modèle 3D
              info:        Fiche technique
              gallery:     Galerie d'images
              plans:       Plans & documents
              annotations: Points d'intérêt
            default:
              - model
              - info
              - gallery
              - annotations


  # ─────────────────────────────────────────────────────────────────────
  #  Tab 2 — Modèle 3D
  #
  #  Three.js viewer config + textured OBJ/GLB pairs for exterior and
  #  interior + hotspot JSON + point-of-interest annotations.
  # ─────────────────────────────────────────────────────────────────────
  model:
    label: Modèle 3D
    icon: box
    sections:

      # ── Réglages du viewer ───────────────────────────────────────
      # Combined: viewer URL + default-side toggle + pipeline reminder.
      # The pipeline note used to live in its own section (pipeline_info)
      # but that was just a banner — folded in here as an info field at
      # the bottom of the settings card so it stays close to the upload
      # workflow without claiming a section of its own.
      viewer_settings:
        type: fields
        headline: Réglages du viewer
        fields:
          viewer_url:
            width: 1/2
            type: url
            label: Viewer externe
            placeholder: "https://…"
            help: Potree, Sketchfab, etc. Remplace le viewer Three.js si renseigné.

          model_toggle:
            width: 1/2
            type: toggle
            label: Modèle affiché par défaut
            text:
              - Extérieur
              - Intérieur
            default: false

          pipeline_note:
            label: false
            type: info
            theme: info
            text: |
              **Pipeline OBJ** — Exportez le modèle en OBJ + texture depuis Blender,
              puis les hotspots en JSON via l'addon GoHéritage. Les textures sont
              compressées automatiquement à l'upload.

      # ── Modèle extérieur ─────────────────────────────────────────
      # All exterior 3D assets in one section: model, texture, hotspots.
      # Accordion trigger removed — sections are already collapsible at
      # the panel level via the edit/lock pattern.
      exterior_files:
        type: fields
        headline: Modèle extérieur
        fields:
          model_obj:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            help: Fichier OBJ exporté depuis Blender.

          model_texture:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. Déposez un PNG puis comprimez en WebP.

          model_hotspots_json:
            type: upload-overwrite
            label: Hotspots (JSON)
            accept: ".json"
            template: default
            help: JSON exporté par l'addon Blender pour le modèle extérieur.

      # ── Modèle intérieur ─────────────────────────────────────────
      interior_files:
        type: fields
        headline: Modèle intérieur
        fields:
          model_obj_interior:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            template: model
            help: Fichier OBJ exporté depuis Blender.

          model_texture_interior:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. Déposez un PNG puis comprimez en WebP.

          model_hotspots_json_interior:
            type: upload-overwrite
            label: Hotspots (JSON)
            accept: ".json"
            template: default
            help: JSON exporté par l'addon Blender pour le modèle intérieur.

      # ── Points d'intérêt (titres + descriptions des hotspots) ────
      annotations_section:
        type: fields
        headline: Points d'intérêt
        fields:

          # Single annotations structure for both exterior and interior
          # hotspots. Each row carries a `location` column so the viewer
          # knows which model to attach the marker to. Two previously
          # separate fields (`annotations` + `annotations_interior`) were
          # merged in May 2026 — existing pages were migrated by
          # `scripts/migrate-annotations.php`.
          annotations:
            type: structure
            label: Points d'intérêt
            sortBy: location asc
            columns:
              location:
                width: 1/12
                label: Modèle
              hotspot_id:
                width: 2/12
                label: ID
              title:
                width: 3/12
                label: Titre
              camera_mode:
                width: 2/12
                label: Mode
              description:
                width: 4/12
                label: Description
            fields:
              location:
                type: select
                label: Modèle
                default: exterior
                required: true
                options:
                  exterior: Extérieur
                  interior: Intérieur
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                help: Doit correspondre au nom de l'Empty dans Blender.
              title:
                type: text
                label: Titre
                placeholder: "ex. Voûte principale"
              camera_mode:
                type: select
                label: Comportement au clic
                default: fly
                options:
                  fly:        Voler vers le point
                  orbit:      Orbiter autour du point
                  auto-orbit: Orbite automatique (360°)
              description:
                type: writer
                label: Description


  # ─────────────────────────────────────────────────────────────────────
  #  Tab 3 — Documents
  #
  #  Single tab, three clearly-separated cards:
  #    1) Plans & relevés  — visual thumbnails (cards layout, with the
  #       plan viewer reachable from each tile)
  #    2) Autres documents — list layout so date, size and type are
  #       columnar and scannable
  #    3) Tous les fichiers — flat list of every file attached to the
  #       page, including model files uploaded from the 3D tab
  # ─────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────
  #  Tab 3 — Fichiers (raw file inventory — comes BEFORE Documents on
  #  purpose; this is the "see everything" view, Documents is the
  #  curated upload UI).
  # ─────────────────────────────────────────────────────────────────────
  files:
    label: Fichiers
    icon: folder-structure
    sections:

      all_files:
        type: fields
        headline: Inventaire des fichiers
        fields:
          page_files:
            type: page-files-list
            label: false
            help: |
              Liste plate de **tous les fichiers attachés à cette page** — modèles 3D,
              textures, plans, images de galerie, JSON, etc. Pour téléverser des
              fichiers, utilisez les onglets dédiés (Documents, Modèle 3D, etc.).


  # ─────────────────────────────────────────────────────────────────────
  #  Tab 4 — Documents (curated upload UI: Plans + Autres documents)
  # ─────────────────────────────────────────────────────────────────────
  documents:
    label: Documents
    icon: file-document
    sections:

      # ── 1. Plans & relevés ───────────────────────────────────────
      plans:
        type: files
        headline: Plans & relevés
        info: "{{ file.niceSize }} · {{ file.modified('d.m.Y') }} · {{ file.extension }}"
        layout: cards
        size: small
        empty: Aucun plan pour l'instant. Glissez-déposez des PDF, JPG, PNG, SVG ou DWG ici.
        template: default
        accept: ".pdf,.jpg,.jpeg,.png,.webp,.dwg,.dxf,.svg"
        image:
          back: pattern
          cover: true

      # ── 2. Autres documents ──────────────────────────────────────
      docs:
        type: files
        headline: Autres documents
        # In list layout the info string becomes the row's secondary line,
        # right next to the filename, so dates and sizes are always visible.
        info: "{{ file.extension | upper }} · {{ file.niceSize }} · modifié {{ file.modified('d.m.Y') }}"
        layout: list
        empty: Rien pour l'instant. Glissez-déposez ici vos PDF, .docx, .zip, etc.
        template: default
        accept: ".pdf,.doc,.docx,.odt,.txt,.md,.zip"
