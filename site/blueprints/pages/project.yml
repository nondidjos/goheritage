title: Projet Patrimonial
icon: box

num: 0

status:
  draft:
    label: Brouillon
    text: Pas encore visible sur la carte.
  listed:
    label: Publié
    text: Visible sur la carte et le site.

tabs:
  # ── Tab 1 : Contenu ────────────────────────────────────────────────────────
  content:
    label: Contenu
    icon: text
    fields:
      description:
        type: textarea
        label: Description courte
        help: Résumé affiché sous le titre et sur les cartes du site.
        size: small

      text:
        type: blocks
        label: Contenu détaillé
        fieldsets:
          - heading
          - text
          - image
          - gallery
          - video
          - quote
          - section

      gallery:
        type: files
        label: Galerie
        layout: cards
        size: medium
        help: Images affichées dans la grille de droite de la page projet.
        uploads: image
        query: page.images.template('image')

  # ── Tab 2 : Fiche technique ────────────────────────────────────────────────
  info:
    label: Fiche technique
    icon: table
    columns:
      - width: 1/2
        fields:
          cover: fields/cover

          location:
            type: text
            label: Lieu
            placeholder: "ex. Bruxelles, Belgique"

          construction_date:
            type: text
            label: Date de construction
            placeholder: "ex. XVe siècle, 1889"

          architect:
            type: text
            label: Architecte / Créateur
            placeholder: "ex. Victor Horta"

          style:
            type: text
            label: Style architectural
            placeholder: "ex. Art Nouveau, Gothique"

          dimensions:
            type: text
            label: Dimensions (L × l × H)
            placeholder: "ex. 40 × 20 × 15 m"

      - width: 1/2
        fields:
          protection_status:
            type: select
            label: Statut de protection
            options:
              classé: Classé Monument Historique
              unesco: Inscrit au patrimoine mondial de l'UNESCO
              regional: Inventaire Régional
              none: Non protégé

          location_search:
            type: location-search
            label: Recherche de coordonnées
            help: Tapez un nom de lieu pour remplir automatiquement la latitude et la longitude.

          lat:
            type: number
            label: Latitude
            step: 0.000001
            placeholder: "ex. 50.8503"

          lng:
            type: number
            label: Longitude
            step: 0.000001
            placeholder: "ex. 4.3517"

          date:
            type: date
            label: Date du scan
            default: now

          tags:
            type: tags
            label: Tags
            options: query
            query: site.index.pluck("tags", ",", true)
            help: "Commencez à taper pour réutiliser un tag existant ou appuyez sur Entrée pour en créer un nouveau."

  # ── Tab 3 : Modèle 3D ─────────────────────────────────────────────────────
  viewer:
    label: Modèle 3D
    icon: box
    columns:
      - width: 1/2
        fields:
          viewer_url:
            type: url
            label: Viewer externe
            placeholder: "https://…"
            help: Potree, Sketchfab, etc. Remplace le viewer Three.js si renseigné.

      - width: 1/2
        fields:
          model_toggle:
            type: toggle
            label: Quel modèle afficher par défaut ?
            text:
              - Extérieur
              - Intérieur
            default: false

      - width: 1/1
        fields:
          obj_info:
            label: false
            type: info
            theme: info
            text: >
              **Pipeline OBJ** — Exportez le modèle en OBJ + texture depuis Blender,
              puis les hotspots en JSON via l'addon GoHéritage (onglet Options de point d'intérêt).
              Les textures sont compressées automatiquement à l'upload.

      # ── Fichiers : Extérieur & Intérieur ─────────────────────────────────────
      - width: 1/1
        fields:
          # EXTERIOR
          exterior_accordion:
            type: accordion-trigger
            label: Modèle Extérieur
            target: exterior
            defaultOpen: true

          model_obj:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            template: model
            help: Fichier OBJ exporté depuis Blender.



          model_texture:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. Déposez un PNG puis choisissez la qualité et cliquez sur l'icône image pour comprimer en JPEG.

          # INTERIOR
          interior_accordion:
            type: accordion-trigger
            label: Modèle Intérieur
            target: interior
            defaultOpen: false

          model_obj_interior:
            width: 1/2
            type: upload-overwrite
            label: Modèle OBJ
            accept: ".obj"
            template: model
            help: Fichier OBJ exporté depuis Blender.



          model_texture_interior:
            width: 1/2
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur. Déposez un PNG puis choisissez la qualité et cliquez sur l'icône image pour comprimer en JPEG.


  # ── Tab 4 : Fichiers ──────────────────────────────────────────────────────
  files:
    label: Fichiers
    icon: file
    columns:
      - width: 1/1
        fields:
          page_files:
            type: page-files-list

  # ── Tab 5 : Points d'intérêt ──────────────────────────────────────────────
  annotations:
    label: Points d'intérêt
    icon: pin
    columns:
      - width: 1/1
        fields:
          annotations_info:
            label: false
            type: info
            text: >
              Les points d'intérêt apparaissent sous forme de labels cliquables
              sur le modèle 3D. Les positions sont lues depuis le **fichier JSON**
              exporté par l'addon Blender. L'identifiant doit correspondre au nom
              de l'Empty placé dans Blender (ex. `hotspot_01`).

          model_hotspots_json:
            type: upload-overwrite
            label: Hotspots JSON
            accept: ".json"
            template: default
            help: "Fichier JSON exporté par l'addon Blender. Contient les positions des points d'intérêt (extérieur + intérieur)."

          hotspot_detect:
            type: hotspot-detect
            label: Détection automatique

          annotations:
            type: structure
            label: Liste des hotspots
            columns:
              hotspot_id:
                width: 1/6
                label: ID
              title:
                width: 1/4
                label: Titre
              camera_mode:
                width: 1/6
                label: Mode
              description:
                width: 5/12
                label: Description
            fields:
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                help: Doit correspondre au nom de l'Empty dans Blender.
              title:
                type: text
                label: Titre
                placeholder: "ex. Voûte principale"
              camera_mode:
                type: select
                label: Comportement au clic
                default: fly
                options:
                  fly: Voler vers le point
                  orbit: Orbiter autour du point
                  auto-orbit: Orbite automatique (360°)
                help: "Voler : anime la caméra vers la position. Orbiter : idem, puis permet d'orbiter autour. Auto : vol + rotation 360° automatique."
              description:
                type: writer
                label: Description
                help: Texte affiché dans le panneau latéral quand ce point est sélectionné.
