title: Projet Patrimonial
icon: box

num: 0

status:
  draft:
    label: Brouillon
    text: Pas encore visible sur la carte.
  listed:
    label: Publié
    text: Visible sur la carte et le site.

tabs:
  # ── Tab 1 : Contenu ────────────────────────────────────────────────────────
  content:
    label: Contenu
    icon: text
    fields:
      description:
        type: textarea
        label: Description courte
        help: Résumé affiché sous le titre et sur les cartes du site.
        size: small

      text:
        type: blocks
        label: Contenu détaillé
        fieldsets:
          - heading
          - text
          - image
          - gallery
          - video
          - quote
          - hotspot
          - poi
          - section

      gallery:
        type: files
        label: Galerie
        layout: cards
        size: medium
        help: Images affichées dans la grille de droite de la page projet.
        uploads: image
        query: page.images.template('image')

  # ── Tab 2 : Fiche technique ────────────────────────────────────────────────
  info:
    label: Fiche technique
    icon: table
    columns:
      - width: 1/2
        fields:
          cover: fields/cover

          location:
            type: text
            label: Lieu
            placeholder: "ex. Bruxelles, Belgique"

          construction_date:
            type: text
            label: Date de construction
            placeholder: "ex. XVe siècle, 1889"

          architect:
            type: text
            label: Architecte / Créateur
            placeholder: "ex. Victor Horta"

          style:
            type: text
            label: Style architectural
            placeholder: "ex. Art Nouveau, Gothique"

          dimensions:
            type: text
            label: Dimensions (L × l × H)
            placeholder: "ex. 40 × 20 × 15 m"

      - width: 1/2
        fields:
          protection_status:
            type: select
            label: Statut de protection
            options:
              classé: Classé Monument Historique
              unesco: Inscrit au patrimoine mondial de l'UNESCO
              regional: Inventaire Régional
              none: Non protégé

          lat:
            type: number
            label: Latitude
            step: 0.000001
            placeholder: "ex. 50.8503"

          lng:
            type: number
            label: Longitude
            step: 0.000001
            placeholder: "ex. 4.3517"

          date:
            type: date
            label: Date du scan
            default: now

          tags:
            type: tags
            label: Tags
            options: query
            query: site.index.pluck("tags", ",", true)
            help: "Commencez à taper pour réutiliser un tag existant ou appuyez sur Entrée pour en créer un nouveau."

  # ── Tab 3 : Modèle 3D ─────────────────────────────────────────────────────
  viewer:
    label: Modèle 3D
    icon: box
    columns:
      - width: 1/1
        fields:
          glb_info:
            label: false
            type: info
            theme: info
            text: >
              Utilisez l'addon GoHéritage dans Blender pour placer les points d'intérêt,
              puis exportez via **Fichier → Exporter → glTF 2.0 (.glb)**.
              Les hotspots et positions de caméra sont intégrés automatiquement.

      # ── Extérieur ────────────────────────────────────────────────────────────
      - width: 2/3
        fields:
          model_glb:
            type: upload-overwrite
            label: Extérieur
            accept: ".glb"
            template: model
            help: Modèle GLB exporté depuis Blender.

      - width: 1/3
        fields:
          viewer_url:
            type: url
            label: Viewer externe
            placeholder: "https://…"
            help: Potree, Sketchfab, etc. Remplace le viewer Three.js si renseigné.

      # ── Intérieur ────────────────────────────────────────────────────────────
      - width: 2/3
        fields:
          model_glb_interior:
            type: upload-overwrite
            label: Intérieur
            accept: ".glb"
            template: model
            help: "Optionnel — affiche un bouton Ext. / Int. dans le viewer."

  # ── Tab 4 : Modèle 3D (obsolète) ──────────────────────────────────────────
  viewer_legacy:
    label: Modèle 3D (obsolète)
    icon: box
    columns:
      - width: 1/1
        fields:
          obj_section_info:
            label: false
            type: info
            theme: warning
            text: "**Import alternatif OBJ** — Ce format n'inclut pas les hotspots ni les positions de caméra. Préférez le GLB si possible."

      - width: 1/2
        fields:
          model_obj:
            type: upload-overwrite
            label: Fichier OBJ
            accept: ".obj"
            template: model
            help: Ignoré si un fichier GLB est présent.

      - width: 1/2
        fields:
          model_texture:
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            prefix: texture_
            template: image
            help: "Texture couleur pour le modèle OBJ. Le fichier doit commencer par `texture_` (ex. `texture_chapelle.jpg`)."

      - width: 1/2
        fields:
          model_normal:
            type: upload-overwrite
            label: Normal Map
            accept: ".jpg,.jpeg,.png"
            prefix: normal_
            template: image
            help: "Texture de normales pour le modèle OBJ. Le fichier doit commencer par `normal_` (ex. `normal_chapelle.jpg`)."

      - width: 1/2
        fields:
          model_mtl:
            type: files
            label: Fichier .mtl
            multiple: false
            accept:
              extension: mtl
            help: Optionnel. Matériaux exportés avec le fichier OBJ.

      - width: 1/2
        fields:
          compress_textures:
            type: toggle
            label: Compression de la texture
            text:
              - Désactivée
              - Activée (JPEG, max 8192 px)
            default: true
            help: Compresse la texture diffuse à l'upload pour le web.

      # ── OBJ intérieur ────────────────────────────────────────────────────────
      - width: 1/1
        fields:
          obj_interior_info:
            label: false
            type: info
            theme: warning
            text: "**OBJ intérieur** — Comme pour l'extérieur, ce format n'inclut pas les hotspots. Ignoré si un GLB intérieur est présent."

      - width: 1/2
        fields:
          model_obj_interior:
            type: upload-overwrite
            label: Fichier OBJ — Intérieur
            accept: ".obj"
            template: model
            help: Modèle OBJ pour l'intérieur.

      - width: 1/2
        fields:
          model_texture_interior:
            type: upload-overwrite
            label: Texture diffuse — Intérieur
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture couleur pour le modèle OBJ intérieur.

      - width: 1/2
        fields:
          model_normal_interior:
            type: upload-overwrite
            label: Normal Map — Intérieur
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture de normales pour le modèle OBJ intérieur.

  # ── Tab 5 : Points d'intérêt ──────────────────────────────────────────────
  annotations:
    label: Points d'intérêt
    icon: pin
    columns:
      - width: 1/1
        fields:
          annotations_info:
            label: false
            type: info
            text: >
              Les points d'intérêt apparaissent sous forme de labels cliquables
              sur le modèle 3D. Ils sont **détectés automatiquement** à l'upload
              d'un fichier GLB. L'identifiant doit correspondre au nom de l'Empty
              placé dans Blender (ex. `hotspot_01`).

          hotspot_detect:
            type: hotspot-detect
            label: Détection automatique

          annotations:
            type: structure
            label: Annotations
            columns:
              hotspot_id:
                width: 1/6
                label: ID
              title:
                width: 1/4
                label: Titre
              camera_mode:
                width: 1/6
                label: Mode
              description:
                width: 5/12
                label: Description
            fields:
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                required: true
                help: Doit correspondre au nom de l'Empty dans Blender.
              title:
                type: text
                label: Titre
                required: true
                placeholder: "ex. Voûte principale"
              camera_mode:
                type: select
                label: Comportement au clic
                default: fly
                options:
                  fly: Voler vers le point
                  orbit: Orbiter autour du point
                  auto-orbit: Orbite automatique (360°)
                help: "Voler : anime la caméra vers la position. Orbiter : idem, puis permet d'orbiter autour. Auto : vol + rotation 360° automatique."
              description:
                type: writer
                label: Description
                help: Texte affiché dans le panneau latéral quand ce point est sélectionné.
