title: Projet Patrimonial
icon: box

num: 0

status:
  draft:
    label: Brouillon
    text: Pas encore visible sur la carte.
  listed:
    label: Publié
    text: Visible sur la carte et le site.

tabs:
  # ── Tab 1 : Contenu ────────────────────────────────────────────────────────
  content:
    label: Contenu
    icon: text
    fields:
      description:
        type: textarea
        label: Description courte
        help: Résumé affiché sous le titre et sur les cartes du site.
        size: small

      text:
        type: blocks
        label: Contenu détaillé
        fieldsets:
          - heading
          - text
          - image
          - gallery
          - video
          - quote
          - hotspot

      gallery:
        type: files
        label: Galerie
        layout: cards
        size: medium
        help: Images affichées dans la grille de droite de la page projet.
        uploads: image
        query: page.images.template('image')

      additional_images:
        type: files
        label: Images supplémentaires
        layout: cards
        size: medium
        help: Images complémentaires affichées sous la fiche technique.
        uploads: image
        query: page.images.template('image')

  # ── Tab 2 : Fiche technique ────────────────────────────────────────────────
  info:
    label: Fiche technique
    icon: list
    columns:
      - width: 1/2
        fields:
          cover: fields/cover

          location:
            type: text
            label: Lieu
            placeholder: "ex. Bruxelles, Belgique"

          construction_date:
            type: text
            label: Date de construction
            placeholder: "ex. XVe siècle, 1889"

          architect:
            type: text
            label: Architecte / Créateur
            placeholder: "ex. Victor Horta"

          style:
            type: text
            label: Style architectural
            placeholder: "ex. Art Nouveau, Gothique"

          dimensions:
            type: text
            label: Dimensions (L × l × H)
            placeholder: "ex. 40 × 20 × 15 m"

      - width: 1/2
        fields:
          protection_status:
            type: select
            label: Statut de protection
            options:
              classé: Classé Monument Historique
              unesco: Inscrit au patrimoine mondial de l'UNESCO
              regional: Inventaire Régional
              none: Non protégé

          condition:
            type: select
            label: État de conservation
            options:
              excellent: Excellent
              bon: Bon
              peril: En péril
              ruine: Ruine
              disparu: Disparu

          lat:
            type: number
            label: Latitude
            step: 0.000001
            placeholder: "ex. 50.8503"

          lng:
            type: number
            label: Longitude
            step: 0.000001
            placeholder: "ex. 4.3517"

          date:
            type: date
            label: Date du scan
            default: now

          tags:
            type: tags
            label: Tags
            options: query
            query: site.index.pluck("tags", ",", true)
            help: "Commencez à taper pour réutiliser un tag existant ou appuyez sur Entrée pour en créer un nouveau."

  # ── Tab 3 : Modèle 3D ─────────────────────────────────────────────────────
  viewer:
    label: Modèle 3D
    icon: box
    columns:
      # ── Workflow principal : GLB (Blender) ──────────────────────────────────
      - width: 1/1
        fields:
          glb_workflow_info:
            type: info
            theme: info
            text: >
              **Workflow recommandé — Blender → GLB**

              Utilisez l'addon Blender *GoHéritage Hotspots* pour placer vos points d'intérêt,
              puis exportez le fichier via **Fichier → Exporter → glTF 2.0 (.glb/.gltf)**.
              Déposez le fichier `.glb` ci-dessous. Les points d'intérêt et positions de caméra
              sont lus automatiquement depuis le fichier.

      - width: 1/2
        fields:
          model_glb:
            type: upload-overwrite
            label: Fichier GLB
            accept: ".glb"
            template: model
            help: Modèle 3D au format glTF binaire, exporté depuis Blender. Remplace le workflow OBJ.

          compress_textures:
            type: toggle
            label: Compression des textures
            text:
              - Désactivée
              - Activée (JPEG optimisé)
            default: true
            help: Compresse les textures uploadées en JPEG web-ready (max 8192 px, qualité 80).

      - width: 1/2
        fields:
          viewer_url:
            type: url
            label: Viewer externe
            placeholder: "https://…"
            help: >
              URL d'un viewer tiers (Potree, Sketchfab…). Si renseigné, charge un iframe
              à la place du viewer Three.js — le champ GLB est ignoré.

      # ── Workflow alternatif : OBJ (héritage) ────────────────────────────────
      - width: 1/1
        fields:
          obj_workflow_info:
            type: info
            theme: warning
            text: >
              **Workflow alternatif — OBJ (héritage)**

              Les champs ci-dessous permettent de charger un modèle OBJ sans Blender.
              Ce format ne supporte pas les points d'intérêt ni les positions de caméra.
              Préférez l'export GLB dès que possible.

      - width: 1/2
        fields:
          model_obj:
            type: files
            label: Fichier OBJ
            multiple: false
            accept:
              extension: obj
            help: Modèle au format Wavefront OBJ. Ignoré si un fichier GLB est présent.

          model_texture:
            type: upload-overwrite
            label: Texture diffuse
            accept: ".jpg,.jpeg,.png"
            template: image
            help: Texture à appliquer sur le modèle OBJ.

      - width: 1/2
        fields:
          model_mtl:
            type: files
            label: Fichier matériaux (.mtl)
            multiple: false
            accept:
              extension: mtl
            help: Optionnel. Matériaux exportés avec le fichier OBJ.

  # ── Tab 4 : Points d'intérêt ──────────────────────────────────────────────
  annotations:
    label: Points d'intérêt
    icon: pin
    columns:
      - width: 1/1
        fields:
          annotations_info:
            type: info
            text: >
              Les points d'intérêt apparaissent sous forme de labels cliquables
              sur le modèle 3D. Ils sont **détectés automatiquement** à l'upload
              d'un fichier GLB. L'identifiant doit correspondre au nom de l'Empty
              placé dans Blender (ex. `hotspot_01`).

          hotspot_detect:
            type: hotspot-detect
            label: Détection automatique

          annotations:
            type: structure
            label: Annotations
            columns:
              hotspot_id:
                width: 1/6
                label: ID
              title:
                width: 1/4
                label: Titre
              camera_mode:
                width: 1/6
                label: Mode
              description:
                width: 5/12
                label: Description
            fields:
              hotspot_id:
                type: text
                label: Identifiant
                placeholder: "hotspot_01"
                required: true
                help: Doit correspondre au nom de l'Empty dans Blender.
              title:
                type: text
                label: Titre
                required: true
                placeholder: "ex. Voûte principale"
              camera_mode:
                type: select
                label: Comportement au clic
                default: fly
                options:
                  fly: Voler vers le point
                  orbit: Orbiter autour du point
                help: "Voler : anime la caméra vers la position enregistrée. Orbiter : recentre l'orbite sans déplacer la caméra."
              description:
                type: writer
                label: Description
                help: Texte affiché dans le panneau latéral quand ce point est sélectionné.
