title: Heritage Project
icon: 🏛️

num: 0

status:
  draft:
    label: Draft
    text: Not visible on the map yet.
  listed:
    label: Published
    text: Visible on the map.

columns:
  - width: 2/3
    fields:
      description:
        type: textarea
        label: Short Description

      text:
        type: blocks
        label: Full Content

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          cover: fields/cover
          location:
            type: text
            label: Location Name
            placeholder: "e.g. Les Andelys, Normandie"
          lat:
            type: number
            label: Latitude
            step: 0.000001
          lng:
            type: number
            label: Longitude
            step: 0.000001
          date:
            type: date
            label: Scan Date
            default: now
          tags:
            type: tags
            label: Tags
