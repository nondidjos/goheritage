title: Heritage Project
icon: 🏛️

num: 0

status:
  draft:
    label: Draft
    text: Not visible on the map yet.
  listed:
    label: Published
    text: Visible on the map.

columns:
  - width: 2/3
    fields:
      description:
        type: textarea
        label: Short Description

      text:
        type: blocks
        label: Full Content

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          cover: fields/cover
          location:
            type: text
            label: Location Name
            placeholder: "e.g. Bruxelles, Belgique"
          construction_date:
            type: text
            label: Date de construction
            placeholder: "e.g. 15ème siècle"
          dimensions:
            type: text
            label: Dimensions du bâtiment
            placeholder: "e.g. 103x340x70m"
          style:
            type: text
            label: Style architectural
            placeholder: "e.g. Baroque, Gothique"
          model_url:
            type: url
            label: 3D Model URL (.glb)
            placeholder: "https://example.com/model.glb"
            help: "URL to a .glb 3D model file for the viewer"
          lat:
            type: number
            label: Latitude
            step: 0.000001
          lng:
            type: number
            label: Longitude
            step: 0.000001
          date:
            type: date
            label: Scan Date
            default: now
          tags:
            type: tags
            label: Tags

      gallery:
        type: files
        label: Gallery Images
        layout: cards
        size: small
        template: blocks/image
