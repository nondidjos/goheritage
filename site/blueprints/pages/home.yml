title: Accueil
icon: home

options:
  changeStatus: false

tabs:
  hero:
    label: Hero
    fields:
      heroHeading:
        label: Titre principal
        type: text
      heroImage:
        label: Image ou vidéo hero
        type: files
        max: 1
        query: page.files.filterBy('type', 'in', ['image', 'video'])
        help: Image ou vidéo affichée dans la colonne de droite du hero (la vidéo sera muette et en boucle)

  compare:
    label: Jumeau numérique
    fields:
      compareHeading:
        label: Titre de la section
        type: text
      compareText:
        label: Texte d'accompagnement
        type: textarea
      compareImageBefore:
        label: Image Avant (photo)
        type: files
        max: 1
      compareImageAfter:
        label: Image Après (modèle 3D)
        type: files
        max: 1

  procede:
    label: Procédé
    fields:
      procedeHeading:
        label: Titre de la section
        type: text

      step1Title:
        label: "Étape 1 — Titre"
        type: text
        width: 1/2
      step1Text:
        label: "Étape 1 — Texte"
        type: textarea
        size: small
        width: 1/2
      step1Image:
        label: "Étape 1 — Image"
        type: files
        max: 1

      step2Title:
        label: "Étape 2 — Titre"
        type: text
        width: 1/2
      step2Text:
        label: "Étape 2 — Texte"
        type: textarea
        size: small
        width: 1/2
      step2Image:
        label: "Étape 2 — Image"
        type: files
        max: 1

      step3Title:
        label: "Étape 3 — Titre"
        type: text
        width: 1/2
      step3Text:
        label: "Étape 3 — Texte"
        type: textarea
        size: small
        width: 1/2
      step3Image:
        label: "Étape 3 — Image"
        type: files
        max: 1

  manifesto:
    label: Manifeste
    fields:
      manifestoTag:
        label: Étiquette
        type: text
        placeholder: Conservation par le numérique
      manifestoHeading:
        label: Titre
        type: textarea
        size: small
        placeholder: "Le temps efface.\nNous préservons l'irremplaçable."
      statsInfo:
        type: info
        theme: info
        text: Statistiques
      stat1Value:
        label: "Stat 1 — Valeur"
        type: text
        width: 1/2
        placeholder: "10×"
      stat1Desc:
        label: "Stat 1 — Description"
        type: textarea
        size: small
        width: 1/2
      stat2Value:
        label: "Stat 2 — Valeur"
        type: text
        width: 1/2
        placeholder: "0.1mm"
      stat2Desc:
        label: "Stat 2 — Description"
        type: textarea
        size: small
        width: 1/2
      stat3Value:
        label: "Stat 3 — Valeur"
        type: text
        width: 1/2
        placeholder: "∞"
      stat3Desc:
        label: "Stat 3 — Description"
        type: textarea
        size: small
        width: 1/2
      manifestoFooterText:
        label: Texte bas de section
        type: textarea
        size: small

  deliverables:
    label: Livrables
    fields:
      deliverablesTag:
        label: Étiquette
        type: text
        placeholder: Métrologie & livrables
      deliverablesHeading:
        label: Titre
        type: textarea
        size: small
        placeholder: "Du terrain\nau plan côté."
      deliverablesText:
        label: Description
        type: textarea
        size: small
      deliverablesImage:
        label: Image (portrait, colonne droite)
        type: files
        max: 1
      deliv1Title:
        label: "Livrable 1 — Titre"
        type: text
        width: 1/2
      deliv1Text:
        label: "Livrable 1 — Texte"
        type: textarea
        size: small
        width: 1/2
      deliv2Title:
        label: "Livrable 2 — Titre"
        type: text
        width: 1/2
      deliv2Text:
        label: "Livrable 2 — Texte"
        type: textarea
        size: small
        width: 1/2
      deliv3Title:
        label: "Livrable 3 — Titre"
        type: text
        width: 1/2
      deliv3Text:
        label: "Livrable 3 — Texte"
        type: textarea
        size: small
        width: 1/2

  projects:
    label: Projets
    fields:
      projectsHeading:
        label: Titre de la section projets
        type: text

  impact:
    label: Mission
    fields:
      impactTag:
        label: Étiquette
        type: text
        placeholder: Notre mission
      impactHeading:
        label: Titre
        type: text
      impactText:
        label: Texte
        type: textarea
      impactImage:
        label: Image de fond
        type: files
        max: 1
