title: Carte
icon: map

# Trim the page options (⋯) menu — drop status/position/template/move so
# nothing greyed-out lingers (the disabled entries are also hidden by the
# panel CSS in project-ux).
options:
  changeStatus: false
  changeTemplate: false
  move: false
  sort: false

# Header buttons (top-right): ONLY the big "Voir la page publique" link.
# No preview, no settings ⋯, no status/visibility pill — the map page is
# always public and is edited via its fields, not the header chrome.
buttons:
  - visit-page

columns:
  - width: 1/3
    sections:
      drafts:
        type: pages
        label: Privé
        template: project
        status: draft
        create: project

      # Link-only projects — listed pages whose visibility is "link":
      # reachable by anyone with the share URL but absent from the public
      # map. Kept out of the "Projets patrimoniaux" section so the public
      # list reflects exactly what visitors see. Orange dot = shared-link
      # state.
      linkonly:
        type: pages
        label: Accès par lien
        query: page.children.listed.filterBy('isLinkOnly', true)
        template: project
        layout: list
        image:
          icon: circle-filled
          color: orange
          back: transparent
        info: "{{ page.location }}"
        empty: Aucun projet en accès par lien.

  - width: 2/3
    sections:
      listed:
        type: pages
        label: Projets patrimoniaux
        query: page.children.listed.filterBy('isPubliclyVisible', true)
        template: project
        sortBy: title asc
        layout: cards
        create: project
        empty: Aucun projet public. Les pages publiées apparaissent ici quand leur visibilité est « Public ».
