# User blueprint — defines fields & sections for every user role unless
# overridden in a role-specific blueprint (e.g. author.yml).
title: Utilisateur

sections:

  # ── 2FA enrollment / management ──────────────────────────────────
  # Registered by site/plugins/totp-2fa. Renders the QR / verify /
  # recovery-codes UI inline so each user can manage their own 2FA.
  # totp_secret and totp_recovery_codes are written by the plugin's
  # API only — they are intentionally NOT exposed as raw fields here.
  totp:
    type: totp-section

  # ── Standard profile fields (kept from the original blueprint) ──
  profile:
    type: fields
    fields:
      street:
        label: Rue
        type: text
        width: 1/2
      zip:
        label: Code postal
        type: text
        width: 1/4
      city:
        label: Ville
        type: text
        width: 1/4
      country:
        label: Pays
        type: text
        width: 1/2
      website:
        label: Site web
        type: url
        width: 1/2
      fediverse:
        label: URL Fédiverse
        type: url
        icon: mastodon
        placeholder: https://example.com/@username
