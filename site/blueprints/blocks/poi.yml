name: Point d'intérêt (3D)
icon: pin
preview: fields

fields:
  hotspot_id:
    type: select
    label: Point d'intérêt lié
    required: true
    placeholder: "Choisir un hotspot…"
    options: query
    query:
      fetch: page.annotations.toStructure
      text: "{{ item.title }}"
      value: "{{ item.hotspot_id }}"
    help: >
      Relie cette section au hotspot 3D correspondant.
      Sur mobile, le contenu apparaît en popup quand le hotspot est activé.
    width: 1/2

  poi_title:
    type: text
    label: Titre
    required: true
    placeholder: "ex. Voûte principale"
    width: 1/2

  poi_content:
    type: blocks
    label: Contenu
    fieldsets:
      - heading
      - text
      - image
      - gallery
      - video
      - quote
