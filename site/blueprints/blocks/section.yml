name: Section extensible
icon: bars
preview: fields
collapsed: true

fields:

  section_title:
    type: text
    label: Titre de la section
    placeholder: "ex. Historique, Description architecturale…"
    width: 2/3

  hotspot_id:
    type: select
    label: Point 3D lié (optionnel)
    required: false
    placeholder: "Aucun — section libre"
    options: query
    query:
      fetch: page.allAnnotations
      text: "{{ item.title }}"
      value: "{{ item.hotspot_id }}"
    help: >
      Une fois ce champ renseigné, la section s'affiche quand on clique sur
      le hotspot correspondant dans la visionneuse 3D. Sur mobile, le
      contenu s'affiche dans une fenêtre contextuelle.
    width: 1/3

  section_content:
    type: blocks
    label: Contenu
    fieldsets:
      - heading
      - text
      - image
      - gallery
      - video
      - quote
