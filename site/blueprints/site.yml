title: Site
icon: home

tabs:
  pages:
    label: Pages
    columns:
      - width: 1/3
        sections:
          pages:
            type: pages
            label: Pages principales
            layout: list
            sortBy: title asc
            templates:
              - home
              - map
              - blog
              - contact

      - width: 2/3
        fields:
          featured_project:
            type: pages
            label: Projet mis en avant (Accueil)
            query: site.find("map").children.listed
            max: 1
            layout: cards
            size: large
            image:
              ratio: 16/9
              cover: true
            help: Ce projet sera affiché en évidence sur la page d'accueil.

  footer:
    label: Pied de page
    columns:
      - width: 1/1
        fields:
          footer_tagline:
            type: textarea
            label: Accroche du pied de page
            help: "S'affiche au-dessus du formulaire de contact."
          footer_email:
            type: email
            label: Email de contact
          social:
            type: structure
            label: Réseaux sociaux
            help: >
              Ajoutez vos comptes. Un lien n'apparaît dans la colonne « Nous
              suivre » du pied de page (site + panneau) QUE si l'URL est remplie
              et commence par https:// — une plateforme sans URL est ignorée.
            columns:
              platform:
                width: 1/3
              url:
                width: 2/3
            fields:
              platform:
                type: text
                label: "Plateforme (ex: LinkedIn, Mastodon)"
              url:
                type: url
                label: Lien URL (https://…)
                placeholder: https://www.linkedin.com/company/…
