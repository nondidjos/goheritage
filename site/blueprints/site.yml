# The `site.yml` blueprint defines the Panel dashboard.

columns:
  - width: 1/2
    sections:
      pages:
        type: pages
        label: Main Pages
        templates:
          - home
          - map
          - blog
          - contact
          - about
          - default

  - width: 1/2
    sections:
      blog:
        extends: sections/blog
      footer_settings:
        type: fields
        fields:
          footer_tagline:
            type: textarea
            label: Footer Tagline
            help: "Shown below the logo in the footer"
          footer_email:
            type: email
            label: Footer Contact Email
