title: Site
icon: home

columns:
  - width: 2/3
    fields:
      featured_project:
        type: pages
        label: Projet mis en avant (Accueil)
        query: site.find("map").children.listed
        max: 1
        layout: cards
        size: large
        image:
          ratio: 16/9
          cover: true
        help: Ce projet sera affiché en évidence sur la page d'accueil.

      featured_article:
        type: pages
        label: Article à la une (Blog)
        query: site.find("blog").children.listed
        max: 1
        layout: cards
        size: large
        help: Cet article sera affiché en tête de liste sur le blog.

  - width: 1/3
    sections:
      pages:
        type: pages
        label: Pages principales
        layout: list
        sortBy: title asc
        templates:
          - home
          - map
          - blog
          - contact

  - width: 1/1
    sections:
      footer_settings:
        type: fields
        fields:
          footer_info:
            type: headline
            label: Paramètres de Pied de Page
          footer_tagline:
            type: textarea
            label: Accroche du pied de page
            help: "S'affiche au dessus du formulaire de contact."
          footer_email:
            type: email
            label: Email de contact
          social:
            type: structure
            label: Réseaux sociaux
            fields:
              platform:
                type: text
                label: "Plateforme (ex: LinkedIn, Twitter)"
              url:
                type: url
                label: Lien URL
