title: Site
icon: home

tabs:
  pages:
    label: Pages
    columns:
      - width: 1/3
        sections:
          pages:
            type: pages
            label: Pages principales
            layout: list
            sortBy: title asc
            templates:
              - home
              - map
              - blog
              - contact

      - width: 2/3
        fields:
          featured_project:
            type: pages
            label: Projet mis en avant (Accueil)
            query: site.find("map").children.listed
            max: 1
            layout: cards
            size: large
            image:
              ratio: 16/9
              cover: true
            help: Ce projet sera affiché en évidence sur la page d'accueil.

  footer:
    label: Pied de page
    columns:
      - width: 1/2
        fields:
          footer_tagline:
            type: textarea
            label: Accroche du pied de page
            help: "S'affiche au dessus du formulaire de contact."
          footer_email:
            type: email
            label: Email de contact

      - width: 1/2
        fields:
          social:
            type: structure
            label: Réseaux sociaux
            fields:
              platform:
                type: text
                label: "Plateforme (ex: LinkedIn, Mastodon)"
              url:
                type: url
                label: Lien URL
